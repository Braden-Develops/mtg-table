# fail2ban filter: the app's "Host login failed/blocked" and "Metrics login failed" log lines. Installed as
# /etc/fail2ban/filter.d/mtg-host.conf by deploy/install.sh.
[Definition]
failregex = (?:Host|Metrics) login (failed|blocked) (from|for) <HOST>$
journalmatch = _SYSTEMD_UNIT=mtg-table.service
